apiVersion: apps/v1
kind: Deployment
metadata:
  name: ws
  namespace: anthe-labs-mainnet
  labels:
    app: ws
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: ws
  template:
    metadata:
      labels:
        app: ws
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 3000
        fsGroup: 2000
        runAsNonRoot: true
      containers:
        - name: ws
          image: REPLACE_WITH_IMAGE
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          ports:
            - containerPort: 4001
              name: app
          envFrom:
            - secretRef:
                name: ws-secret
        
---
apiVersion: v1
kind: Service
metadata:
  name: ws
  namespace: anthe-labs-mainnet
spec:
  selector:
    app: ws
  type: ClusterIP
  ports:
  - name: ws
    protocol: TCP
    port: 4001
    targetPort: 4001

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ws
  namespace: anthe-labs-mainnet
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ws
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
