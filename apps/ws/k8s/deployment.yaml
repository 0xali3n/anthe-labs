apiVersion: apps/v1
kind: Deployment
metadata:
  name: ws
  namespace: anthe-labs-mainnet
  labels:
    app: ws
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ws
  template:
    metadata:
      labels:
        app: ws
    spec:
      containers:
        - name: ws
          image: REPLACE_WITH_IMAGE
          imagePullPolicy: Always
          ports:
            - containerPort: 4001
              name: app
          envFrom:
            - secretRef:
                name: ws-secret
        
---
apiVersion: v1
kind: Service
metadata:
  name: ws
  namespace: anthe-labs-mainnet
spec:
  selector:
    app: ws
  type: ClusterIP
  ports:
  - name: ws
    protocol: TCP
    port: 4001
    targetPort: 4001
