tradeVersion: apps/v1
kind: Deployment
metadata:
  name: trade
  namespace: anthe-labs-mainnet
  labels:
    app: trade
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: trade
  template:
    metadata:
      labels:
        app: trade
    spec:
      containers:
        - name: trade
          image: REPLACE_WITH_IMAGE
          imagePullPolicy: Always
          ports:
            - containerPort: 4001
              name: app
          envFrom:
            - secretRef:
                name: trade-secret
        
